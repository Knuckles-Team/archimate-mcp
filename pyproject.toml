[build-system]
requires = [ "setuptools>=80.9.0", "wheel",]
build-backend = "setuptools.build_meta"

[project]
name = "archimate-mcp"
version = "2.2.0"
description = "ArchiMate model engine + MCP Server + A2A Server for Agentic AI!"
readme = "README.md"
classifiers = [ "Development Status :: 4 - Beta", "License :: OSI Approved :: MIT License", "Environment :: Console", "Operating System :: POSIX :: Linux", "Programming Language :: Python :: 3",]
requires-python = ">=3.12, <3.15"
dependencies = [ "agent-utilities>=2.0.0,<3.0.0", "defusedxml>=0.7.1",]
[[project.authors]]
name = "Project Maintainers"
email = "maintainers@users.noreply.github.com"

[project.license]
text = "MIT"

[project.optional-dependencies]
mcp = [ "agent-utilities[mcp]>=2.0.0,<3.0.0",]
agent = [ "agent-utilities[agent-runtime,logfire]>=2.0.0,<3.0.0",]
all = [ "agent-utilities[mcp,agent-runtime,logfire]>=2.0.0,<3.0.0",]
test = [ "pytest-xdist>=3.8.0", "pytest>=9.1.1", "pytest-asyncio>=1.4.0", "pytest-cov>=7.1.0",]

[project.scripts]
archimate-mcp = "archimate_mcp.mcp_server:mcp_server"
archimate-agent = "archimate_mcp.agent_server:agent_server"

[project.entry-points."agent_utilities.skill_providers"]
archimate-mcp = "archimate_mcp.skills"

[project.entry-points."agent_utilities.prompt_providers"]
archimate-mcp = "archimate_mcp.prompts"

# CONCEPT:AU-KG.ontology.package-federation-migration — federate this package's OWL/RDF ontology module into the
# agent-utilities hub (ArchiMate elements, layers, relationships). Resolved via
# iter_provider_dirs like the skill/prompt providers.
[project.entry-points."agent_utilities.ontology_providers"]
archimate-mcp = "archimate_mcp.ontology"

# CONCEPT:AU-KG.ingest.mcp-tool-connector — contribute this package's Tier-1 mcp_tool
# source presets (connectors/mcp_source_presets.json) so the hub can mirror ArchiMate
# elements/relationships into the KG with no agent-utilities code change.
[project.entry-points."agent_utilities.source_connector_providers"]
archimate-mcp = "archimate_mcp.connectors"

[tool.uv.workspace]
members = ["."]

[tool.setuptools]
include-package-data = true

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
follow_imports = "skip"

[dependency-groups]
dev = [ "pytest-timeout>=2.4.0",]

[tool.setuptools.package-data]
archimate_mcp = [ "mcp_config.json", "agent_data/**", "prompts/**", "skills/**", "ontology/**", "connectors/**",]

[tool.ruff.lint]
select = [ "E", "F", "I", "UP", "B",]
ignore = [ "E402", "E501", "B008",]

[tool.setuptools.packages.find]
where = [ ".",]

[tool.uv]
override-dependencies = [
    "fastmcp-slim[client,server]>=4.0.0b1",
]

[tool.uv.sources]
agent-utilities = { path = ".uv-workspace-siblings/agent-utilities", editable = true }
